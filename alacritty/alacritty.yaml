# terminal env vars
env:
  TERM: alacritty

window:
  padding:
    x: 1
    y: 1
  dynamic_padding: false

  # full or none (with or without border/title bar)
  decorations: none

  # do not make the window transparent
  opacity: 1.0

  # allow applications to change the window title with ansi sequences
  dynamic_title: true

scrolling:
  history: 10000

# Font configuration
font:
  size: 12.0
  normal:
    # triplicate a is a little heavier than b but shows up better
    family: 'Triplicate A Code'

  # disable italics
  bold_italic:
    style: Bold
  italic:
    style: Regular

  # the triplicate box drawing characters don't look right for double line borders
  # so just use the builtin font
  builtin_box_drawing: true

  # unicode fallbacks (no bullshit color emoji)
  #
  # these are grouped by the font providing the glyph. for reference:
  #
  # U+00A4  = currency sign
  # U+2116  = numero sign
  # U+2205  = null / empty set
  # U+229E  = squared plus
  # U+24DE  = lowercase 'o' in circle
  # U+25D0  = circle left half black
  # U+25E7  = square left half black
  # U+2699  = gear
  # U+26A0  = warning sign
  # U+2752  = upper right shadow square
  # U+2982  = z notation type colon
  # U+2BBB  = black on white square
  # U+1F13E = uppercase 'o' in square
  # U+1F4A1 = light bulb
  # U+1F4C4 = page facing up
  # U+1F4E6 = package
  # U+1F510 = lock with key
  # U+1F511 = key
  # U+1F512 = lock
  # U+1F513 = open lock
  # U+1F6E0 = hammer and wrench
  codepoint_substitutions:
    - font: Segoe UI Symbol
      codepoints:
        - U+1F4A1
        - U+1F4C4
        - U+1F510
        - U+1F511
        - U+1F512
        - U+1F513
    - font: Unifont
      codepoints:
        - U+00A4
        - U+2982
        - U+2BBB
    - font: Symbola
      codepoints:
        - U+2116
        - U+2205
        - U+229E
        - U+24DE
        - U+25D0
        - U+25E7
        - U+2699
        - U+26A0
        - U+2752
        - U+1F13E
        - U+1F4E6
        - U+1F6E0

draw_bold_text_with_bright_colors: true

# color schemes
colorschemes:
  dalton: &colorscheme-dalton
    primary:
      background: '#000000'
      foreground: '#ffffff'

    # invert colors for selection
    selection:
      text: CellBackground
      background: CellForeground

    # palette
    normal: &colorscheme-dalton-normal
      black:   '#000000'
      red:     '#ff001d'
      green:   '#30db22'
      yellow:  '#ffee67'
      blue:    '#2b7df0'
      magenta: '#ab47bc'
      cyan:    '#32bcd9'
      white:   '#ffffff'

    # use the same colors except for "bright black"
    bright:
      black:   '#555555'
      red:     '#ff001d'
      green:   '#30db22'
      yellow:  '#ffee67'
      blue:    '#2b7df0'
      magenta: '#ab47bc'
      cyan:    '#32bcd9'
      white:   '#ffffff'
    dim:
      *colorscheme-dalton-normal
  google-dark: &colorscheme-google-dark
    primary:
      background: '#000000'
      foreground: '#ffffff'

    # invert colors for selection
    selection:
      text: CellBackground
      background: CellForeground

    # palette
    normal: &colorscheme-google-dark-normal
      black:   '#000000'
      red:     '#cc342b'
      green:   '#198844'
      yellow:  '#f96a38'
      blue:    '#3971ed'
      magenta: '#a36ac7'
      cyan:    '#32bcd9'
      white:   '#ffffff'

    # use consistent colors
    bright:
      *colorscheme-google-dark-normal
    dim:
      *colorscheme-google-dark-normal
  tomorrow-night-bright : &colorscheme-tomorrow-night-bright
    primary:
      background: '#000000'
      foreground: '#ffffff'

    # invert colors for selection
    selection:
      text: CellBackground
      background: CellForeground

    # palette
    normal: &colorscheme-tomorrow-night-bright-normal
      black:   '#000000'
      red:     '#d54e53'
      green:   '#b9ca4a'
      yellow:  '#e7c547'
      blue:    '#2b5b77'
      magenta: '#c397d8'
      cyan:    '#70c0b1'
      white:   '#ffffff'

    # use consistent colors
    bright:
      black:   '#333333'
      red:     '#d54e53'
      green:   '#b9ca4a'
      yellow:  '#e7c547'
      blue:    '#2b5b77'
      magenta: '#c397d8'
      cyan:    '#70c0b1'
      white:   '#ffffff'
    dim:
      *colorscheme-tomorrow-night-bright-normal
  ayu : &colorscheme-ayu
    primary:
      background: '#000000'
      foreground: '#ffffff'

    # invert colors for selection
    selection:
      text: CellBackground
      background: CellForeground

    # palette
    normal: &colorscheme-ayu-normal
      black:   '#000000'
      red:     '#ff3333'
      green:   '#aad94c'
      yellow:  '#ffb454'
      blue:    '#36a3d9'
      magenta: '#e799ff'
      cyan:    '#95e6cb'
      white:   '#ffffff'

    # use consistent colors
    bright:
      black:   '#acb6bf'
      red:     '#ff3333'
      green:   '#aad94c'
      yellow:  '#ffb454'
      blue:    '#36a3d9'
      magenta: '#e799ff'
      cyan:    '#95e6cb'
      white:   '#ffffff'
    dim:
      *colorscheme-ayu-normal

colors:
  *colorscheme-ayu

# disable visual bell
bell:
  duration: 0

selection:
  # word boundary separators
  semantic_escape_chars: ",│║┃`|:\"' ()[]{}<>\t="
  save_to_clipboard: false

cursor:
  style:
    shape: Block
    blinking: Always
  blink_interval: 250
  unfocused_hollow: true
  thickness: 0.5

live_config_reload: true

# default shell: use the brew installed version
shell:
  program: /opt/homebrew/bin/zsh
  args:
    - --login

mouse:
  hide_when_typing: false

# regex hints
hints:
  # enable command click for urls
  enabled:
   - regex: "(mailto:|https:|http:|file:|git:|ssh:|ftp:)\
             [^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
     command: open
     post_processing: true
     mouse:
       enabled: true
       mods: Command
     binding:
       key: U
       mods: Control|Shift

mouse_bindings:
  - { mouse: Middle, action: PasteSelection }

# key bindings
key_bindings:
  # from tmux.conf: 0x01 is ctrl-a, 0x1b is modifier (M-xxx)
  # have this in place so the keyboard shortcuts for pane/window movement work
  - { key: T, mods: Alt|Shift, chars: "\x01\x1bT" }
  - { key: H, mods: Alt|Shift, chars: "\x01\x1bH" }
  - { key: L, mods: Alt|Shift, chars: "\x01\x1bL" }
  - { key: N, mods: Alt|Shift, chars: "\x01\x1bN" }

  # standard quit keys
  - { key: Q, mods: Command, action: Quit }
  - { key: W, mods: Command, action: Quit }

  # let ctrl-space/enter through so it can be used for key mappings. ctrl-enter is a little weird
  # though: we're making up an escape code that doesn't do anything else, in this case "ESC M" and
  # term applications can look for this
  - { key: Space, mods: Control, action: ReceiveChar }
  - { key: Return, mods: Control, chars: "\x1bM" }

  # allow creating a new window easily
  - { key: N, mods: Command, action: CreateNewWindow }
  - { key: F, mods: Command|Control, action: ToggleFullscreen } # or ToggleSimpleFullscreen

  # font sizing
  - { key: Key0, mods: Command, action: ResetFontSize }
  - { key: Equals, mods: Command, action: IncreaseFontSize }
  - { key: Plus, mods: Command, action: IncreaseFontSize }
  - { key: Minus, mods: Command, action: DecreaseFontSize }
